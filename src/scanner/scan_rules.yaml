# ============================================================
# 暮云思辨投资助手 - 全市场扫描规则 (v0.8.4 选股体系升级)
# ============================================================
#
# 设计理念：
#   不做追涨（放量突破/强势动量已删除）
#   核心：趋势确认 + 回调买点 + 低估值价值
#
# 可用字段: change_pct, turnover_rate, volume_ratio, amplitude,
#           price, volume, amount, pe_ratio, pb_ratio, total_mv,
#           circ_mv, code, name, change_speed, change_5min,
#           change_60d, change_ytd
# ============================================================

# 全局排除规则（所有规则集共享）
global_exclude:
  - field: "volume"
    op: "lte"
    value: 0
  - field: "code"
    op: "starts_with"
    value: "8"
  - field: "code"
    op: "starts_with"
    value: "920"
  - field: "name"
    op: "contains"
    value: "退"

rules:
  # ===== 趋势回调买点（推荐，默认规则） =====
  trend_pullback:
    name: "趋势回调"
    description: "上升趋势中(60日涨幅>5%)、今日缩量回调(跌0~3%)、贴近均线附近的健康买点"
    filters:
      - field: "change_60d"
        op: "gt"
        value: 5.0
      - field: "change_pct"
        op: "between"
        value: [-3.0, 0]
      - field: "volume_ratio"
        op: "lt"
        value: 1.0
      - field: "turnover_rate"
        op: "between"
        value: [1.0, 10.0]
      - field: "amplitude"
        op: "lt"
        value: 6.0
      - field: "amount"
        op: "gt"
        value: 100000000
    max_candidates: 30
    sort_by: "change_60d"
    sort_desc: true

  # ===== 趋势蓄势突破（趋势确认+今日启动） =====
  trend_breakout:
    name: "趋势蓄势"
    description: "60日有涨幅基础(>10%)、今日温和放量上涨(0~5%)、仍在趋势中不追涨停"
    filters:
      - field: "change_60d"
        op: "gt"
        value: 10.0
      - field: "change_pct"
        op: "between"
        value: [0, 5.0]
      - field: "volume_ratio"
        op: "between"
        value: [1.0, 3.0]
      - field: "turnover_rate"
        op: "between"
        value: [1.0, 12.0]
      - field: "amplitude"
        op: "lt"
        value: 7.0
      - field: "amount"
        op: "gt"
        value: 100000000
    max_candidates: 20
    sort_by: "volume_ratio"
    sort_desc: true

  # ===== 缩量回调（弱趋势中也可以看） =====
  shrink_pullback:
    name: "缩量回调"
    description: "缩量下跌(量比<0.8)、可能企稳的股票，需深度分析确认是否有趋势支撑"
    filters:
      - field: "change_pct"
        op: "between"
        value: [-5.0, 0]
      - field: "turnover_rate"
        op: "between"
        value: [0.5, 5.0]
      - field: "volume_ratio"
        op: "lt"
        value: 0.8
      - field: "amplitude"
        op: "lt"
        value: 5.0
      - field: "amount"
        op: "gt"
        value: 50000000
    max_candidates: 20
    sort_by: "change_pct"
    sort_desc: false

  # ===== 低估值筛选 =====
  value_pick:
    name: "低估值筛选"
    description: "市盈率<20且市净率<2的低估值股，适合价值投资者"
    filters:
      - field: "pe_ratio"
        op: "between"
        value: [1, 20]
      - field: "pb_ratio"
        op: "between"
        value: [0.1, 2.0]
      - field: "price"
        op: "gt"
        value: 3.0
      - field: "turnover_rate"
        op: "gt"
        value: 0.5
      - field: "amount"
        op: "gt"
        value: 50000000
    max_candidates: 30
    sort_by: "pe_ratio"
    sort_desc: false
