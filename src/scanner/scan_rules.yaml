# ============================================================
# 暮云思辨投资助手 - 全市场扫描规则 (v0.8.4)
# ============================================================
#
# 设计理念：
#   初筛只看当日快照数据（涨跌幅/量比/换手率/振幅/成交额等）
#   趋势判断由深度分析的 Weinstein 阶段(S2/S4)完成
#   不做追涨 — 删除放量突破/强势动量/超跌反弹
#
# 数据源说明：
#   主数据源: 新浪 (无 量比/60日涨跌幅)
#   备用: eFinance (有 量比，无 60日涨跌幅)
#   缺失字段的过滤器会被静默跳过(scanner_filter.py L118)
#
# 可用字段: change_pct, turnover_rate, volume_ratio, amplitude,
#           price, volume, amount, pe_ratio, pb_ratio, total_mv,
#           circ_mv, code, name
# ============================================================

global_exclude:
  - field: "volume"
    op: "lte"
    value: 0
  - field: "code"
    op: "starts_with"
    value: "8"
  - field: "code"
    op: "starts_with"
    value: "920"
  - field: "name"
    op: "contains"
    value: "退"

rules:
  # ===== 健康回调（推荐，默认规则） =====
  healthy_pullback:
    name: "健康回调"
    description: "今日缩量小幅回调(-3%~0)、振幅不大、流动性正常 → 深度分析确认趋势阶段"
    filters:
      - field: "change_pct"
        op: "between"
        value: [-3.0, 0]
      - field: "volume_ratio"
        op: "lt"
        value: 1.0
      - field: "turnover_rate"
        op: "between"
        value: [1.0, 10.0]
      - field: "amplitude"
        op: "lt"
        value: 6.0
      - field: "amount"
        op: "gt"
        value: 100000000
    max_candidates: 30
    sort_by: "amount"
    sort_desc: true

  # ===== 温和上涨（趋势蓄势） =====
  steady_advance:
    name: "温和上涨"
    description: "今日温和放量上涨(0~5%)、不追涨停、流动性好 → 深度分析确认是S2延续还是S3顶部"
    filters:
      - field: "change_pct"
        op: "between"
        value: [0, 5.0]
      - field: "volume_ratio"
        op: "between"
        value: [1.0, 3.0]
      - field: "turnover_rate"
        op: "between"
        value: [1.0, 12.0]
      - field: "amplitude"
        op: "lt"
        value: 7.0
      - field: "amount"
        op: "gt"
        value: 100000000
    max_candidates: 20
    sort_by: "volume_ratio"
    sort_desc: true

  # ===== 缩量回调 =====
  shrink_pullback:
    name: "缩量回调"
    description: "缩量下跌(量比<0.8)、可能企稳 → 需深度分析确认是否在S2上升趋势中"
    filters:
      - field: "change_pct"
        op: "between"
        value: [-5.0, 0]
      - field: "turnover_rate"
        op: "between"
        value: [0.5, 5.0]
      - field: "volume_ratio"
        op: "lt"
        value: 0.8
      - field: "amplitude"
        op: "lt"
        value: 5.0
      - field: "amount"
        op: "gt"
        value: 50000000
    max_candidates: 20
    sort_by: "change_pct"
    sort_desc: false

  # ===== 低估值筛选 =====
  value_pick:
    name: "低估值筛选"
    description: "市盈率<20且市净率<2的低估值股 → 适合价值投资者，需自行判断基本面"
    filters:
      - field: "pe_ratio"
        op: "between"
        value: [1, 20]
      - field: "pb_ratio"
        op: "between"
        value: [0.1, 2.0]
      - field: "price"
        op: "gt"
        value: 3.0
      - field: "turnover_rate"
        op: "gt"
        value: 0.5
      - field: "amount"
        op: "gt"
        value: 50000000
    max_candidates: 30
    sort_by: "pe_ratio"
    sort_desc: false
