{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto p-4">
    <!-- 诊断区（定位问题用，确认后删） -->
    <div class="bg-yellow-100 border border-yellow-400 p-2 mb-3 text-sm rounded flex items-center gap-2 flex-wrap">
        <span id="d-htmx" class="font-mono">htmx: 检查中...</span>
        <span id="d-flask" class="font-mono">| flask: 检查中...</span>
        <button onclick="document.getElementById('d-js').innerText='JS ✓'" class="bg-gray-200 px-2 rounded">测JS</button>
        <span id="d-js" class="font-mono"></span>
    </div>
    <script>
      document.getElementById('d-htmx').innerText = 'htmx: ' + (window.htmx ? '已加载 ✓' : '未加载 ✗');
      fetch('/api/ping').then(r=>r.text()).then(t=>document.getElementById('d-flask').innerText='| flask: 通 ✓').catch(e=>document.getElementById('d-flask').innerText='| flask: 不通 ✗');
    </script>
    <!-- 顶栏 -->
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold text-gray-800">暮云思辨投资助手</h1>
        <button hx-post="/scan" hx-target="#scan-panel" hx-swap="innerHTML"
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded shadow">
            扫描
        </button>
    </div>
    <!-- 主区：左 scan 表 + 右分析栏 -->
    <div class="grid grid-cols-3 gap-4">
        <div class="col-span-1 bg-white rounded shadow p-3">
            <h2 class="font-semibold text-gray-600 mb-2">候选股</h2>
            <div id="scan-panel" class="overflow-auto" style="max-height:600px">
                <p class="text-gray-400 text-sm">点"扫描"开始</p>
            </div>
        </div>
        <div class="col-span-2 bg-white rounded shadow p-4">
            <h2 class="font-semibold text-gray-600 mb-2">深度分析</h2>
            <div id="analysis-panel">
                <p class="text-gray-400 text-sm">点左侧候选股行开始分析</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
