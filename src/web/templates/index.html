{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto p-4">
    <!-- 诊断区（定位用，确认后删） -->
    <div class="bg-yellow-100 border border-yellow-400 p-2 mb-3 text-sm rounded flex items-center gap-2 flex-wrap">
        <span id="d-htmx" class="font-mono">htmx: 检查中...</span>
        <span id="d-flask" class="font-mono">| flask: 检查中...</span>
        <button onclick="document.getElementById('d-js').innerText='JS ✓'" class="bg-gray-200 px-2 rounded">测JS</button>
        <span id="d-js" class="font-mono"></span>
    </div>
    <script>
      document.getElementById('d-htmx').innerText = 'htmx: ' + (window.htmx ? '已加载 ✓' : '未加载 ✗');
      fetch('/api/ping').then(r=>r.text()).then(t=>document.getElementById('d-flask').innerText='| flask: 通 ✓').catch(e=>document.getElementById('d-flask').innerText='| flask: 不通 ✗');
    </script>
    <!-- 顶栏 -->
    <div class="flex justify-between items-center mb-4 bg-white rounded-lg shadow p-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">暮云思辨投资助手</h1>
            <p class="text-xs text-gray-400">flask + Jinja2 + Tailwind + htmx</p>
        </div>
        <button hx-post="/scan" hx-target="#scan-panel" hx-swap="innerHTML"
                class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2.5 rounded-lg shadow font-medium">
            🔍 扫描
        </button>
    </div>
    <!-- 主区：左 scan 表 + 右分析栏 -->
    <div class="grid grid-cols-3 gap-4 mb-4">
        <div class="col-span-1 bg-white rounded-lg shadow p-3">
            <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">候选股</h2>
            <div id="scan-panel" class="overflow-auto" style="max-height:500px">
                <p class="text-gray-400 text-sm p-2">点"扫描"开始</p>
            </div>
        </div>
        <div class="col-span-2 bg-white rounded-lg shadow p-4">
            <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">深度分析</h2>
            <div id="analysis-panel">
                <p class="text-gray-400 text-sm p-2">点左侧候选股行开始分析</p>
            </div>
        </div>
    </div>
    <!-- 底栏：持仓 -->
    <div class="bg-white rounded-lg shadow p-3">
        <div class="flex justify-between items-center mb-2 border-b pb-1">
            <h2 class="font-semibold text-gray-700">持仓</h2>
            <button hx-get="/pos" hx-target="#positions-panel" hx-swap="innerHTML"
                    class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded">↻ 刷新</button>
        </div>
        <div id="positions-panel" hx-get="/pos" hx-trigger="load" hx-swap="innerHTML" class="overflow-auto" style="max-height:200px">
            <p class="text-gray-400 text-sm p-2">加载中...</p>
        </div>
    </div>
</div>
{% endblock %}
