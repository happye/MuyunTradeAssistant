{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto p-4">
    <!-- 顶栏 + 扫描区 -->
    <div class="bg-white rounded-lg shadow p-4 mb-4">
        <div class="flex justify-between items-center mb-3">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">暮云思辨投资助手</h1>
                <p class="text-xs text-gray-400">flask + Jinja2 + Tailwind + htmx</p>
            </div>
        </div>
        <div class="flex gap-2 items-center flex-wrap">
            <select id="scan-rule" name="rule" class="border px-3 py-2 rounded text-sm bg-white">
                <option value="healthy_pullback">健康回调（缩量小跌）</option>
                <option value="steady_advance">温和上涨（放量上涨）</option>
                <option value="shrink_pullback">缩量回调（深跌缩量）</option>
                <option value="value_pick">低估值（PE&lt;20/PB&lt;2）</option>
            </select>
            <input id="scan-theme" type="text" name="theme" placeholder="主题词(可选，如 AI,半导体)" class="border px-3 py-2 rounded text-sm flex-1 min-w-[200px]">
            <button hx-post="/scan" hx-target="#scan-panel" hx-swap="innerHTML" hx-include="#scan-rule,#scan-theme"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg shadow font-medium">🔍 扫描</button>
            <input id="bz-code" type="text" name="code" placeholder="笨总评分代码" class="border px-3 py-2 rounded text-sm w-40">
            <button hx-post="/bz" hx-target="#bz-panel" hx-swap="innerHTML" hx-include="#bz-code"
                    class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium">📊 评分</button>
        </div>
    </div>
    <!-- 主区：左 scan 表 + 右分析栏+回测栏 -->
    <div class="grid grid-cols-3 gap-4 mb-4">
        <div class="col-span-1 bg-white rounded-lg shadow p-3">
            <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">候选股</h2>
            <div id="scan-panel" class="overflow-auto" style="max-height:500px">
                <p class="text-gray-400 text-sm p-2">点"扫描"开始</p>
            </div>
        </div>
        <div class="col-span-2 space-y-4">
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">深度分析</h2>
                <div id="analysis-panel">
                    <p class="text-gray-400 text-sm p-2">点左侧候选股行开始分析</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">回测结果</h2>
                <div id="backtest-panel">
                    <p class="text-gray-400 text-sm p-2">点分析栏的📊回测按钮（结果在此，不覆盖分析）</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">笨总评分</h2>
                <div id="bz-panel">
                    <p class="text-gray-400 text-sm p-2">输入代码点📊评分（6维AI，30-60s）</p>
                </div>
            </div>
        </div>
    </div>
    <!-- 底栏：持仓 + 事件预警 -->
    <div class="grid grid-cols-2 gap-4">
        <div class="bg-white rounded-lg shadow p-3">
            <div class="flex justify-between items-center mb-2 border-b pb-1">
                <h2 class="font-semibold text-gray-700">持仓</h2>
                <button hx-get="/pos" hx-target="#positions-panel" hx-swap="innerHTML"
                        class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded">↻ 刷新</button>
            </div>
            <div id="positions-panel" hx-get="/pos" hx-trigger="load" hx-swap="innerHTML" class="overflow-auto" style="max-height:200px">
                <p class="text-gray-400 text-sm p-2">加载中...</p>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow p-3">
            <div class="flex justify-between items-center mb-2 border-b pb-1">
                <h2 class="font-semibold text-gray-700">事件预警</h2>
                <button hx-get="/events" hx-target="#events-panel" hx-swap="innerHTML"
                        class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded">↻ 刷新</button>
            </div>
            <div id="events-panel" hx-get="/events" hx-trigger="load" hx-swap="innerHTML" class="overflow-auto" style="max-height:200px">
                <p class="text-gray-400 text-sm p-2">加载中...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
