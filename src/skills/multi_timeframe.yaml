# 多时间框架技能
# 来源：系统化交易大纲 第30章
# 核心理念：月线定方向，周线定位置，日线找买卖点
# 第30章原文：
#   - "月线，是告诉你这座山往哪个方向走"
#   - "周线，是告诉你现在爬到半山腰了，还是快到山顶了"
#   - "日线，是告诉你今天该迈左脚还是右脚"
#   - "月线向上，周线和日线的下跌大概率是回调"
#   - "月线向下，周线和日线的上涨大概率是反弹"
#   - "打架（月线向上周线向下）= 等"
#
# ⚠️ 实现限制说明：
# 第30章核心是"月线→周线→日线"三层框架，但当前数据源(Baostock)
# 仅提供日线数据，尚未集成周线/月线数据。因此本技能暂时用日线
# MA5/MA20/MA60近似模拟"短/中/长"三个周期：
#   - MA5 ≈ 日线短期（模拟原"日线"）
#   - MA20 ≈ 日线中期（模拟原"周线"）
#   - MA60 ≈ 日线长期（模拟原"月线"）
# 这是一种妥协实现，不如真实月线/周线数据可靠。
# 后续Phase升级将引入真正的周线/月线数据。

name: multi_timeframe
alias: 多周期共振
description: 综合多周期均线判断市场方向（当前为日线模拟版，待升级为真实周线/月线）

rules:
  # 规则1：短期+中期+长期均线全部多头 - 强烈买入
  # 第30章："只要月线向上，那周线和日线的下跌，大概率是回调"
  - condition:
      price_above_ma5:
        reason: "短期趋势向上（日线维度）"
        weight: 1.0
        confidence: 0.8
      price_above_ma20:
        reason: "中期趋势向上（周线维度近似）"
        weight: 1.0
        confidence: 0.8
      price_above_ma60:
        reason: "长期趋势向上（月线维度近似）"
        weight: 1.5
        confidence: 0.9
    signal: BUY
    confidence: 0.85
    weight: 1.5

  # 规则2：各周期方向不一致 - 谨慎观望
  # 第30章："什么叫打架？就是月线向上，周线向下。这时候怎么办？等。"
  - condition:
      price_above_ma5:
        reason: "短期偏多"
        weight: 1.0
        confidence: 0.6
      price_below_ma20:
        reason: "中期偏空，周期打架"
        weight: 1.0
        confidence: 0.6
    signal: WATCH
    confidence: 0.5
    weight: 1.2

  # 规则3：短期走弱但长期支撑 - 观望等确认
  # 第30章："月线向上，大方向是好的。但周线向下，说明短期要调整"
  - condition:
      price_below_ma5:
        reason: "日线短期走弱"
        weight: 1.0
        confidence: 0.7
      price_below_ma20:
        reason: "周线中期走弱"
        weight: 1.0
        confidence: 0.7
      price_above_ma60:
        reason: "但月线长期趋势仍向上，可能只是回调"
        weight: 1.5
        confidence: 0.8
    signal: WATCH
    confidence: 0.6
    weight: 1.0

  # 规则4：三周期全部向下 - 卖出
  # 第30章："月线向下，周线和日线的上涨大概率是反弹。反弹就是卖点"
  - condition:
      price_below_ma5:
        reason: "短期趋势向下（日线维度）"
        weight: 1.0
        confidence: 0.8
      price_below_ma20:
        reason: "中期趋势向下（周线维度近似）"
        weight: 1.0
        confidence: 0.8
      price_below_ma60:
        reason: "长期趋势向下（月线维度近似）"
        weight: 1.5
        confidence: 0.9
    signal: SELL
    confidence: 0.85
    weight: 1.5
