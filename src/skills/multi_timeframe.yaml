# 多时间框架技能
# 来源：系统化交易大纲 第30章
# 核心理念：月线定方向，周线定位置，日线找买卖点
#
# Phase 6 起改为真实多时间框架：
# - 月线：判断大方向，只做方向过滤
# - 周线：判断位置和中期结构，决定是顺势还是打架
# - 日线：只负责具体触发，不再单独承担方向定义

name: multi_timeframe
alias: 多周期共振
description: 真实多时间框架过滤：月线定方向，周线定位置，日线只做触发

rules:
  # 规则1：月线向上 + 周线同步向上 + 日线触发，才给BUY
  - condition:
      monthly_trend_bullish:
        reason: "月线方向向上，大方向仍在上行"
        weight: 1.0
        confidence: 0.9
      weekly_trend_bullish:
        reason: "周线位置仍在强势区，属于顺势结构"
        weight: 1.0
        confidence: 0.8
      price_above_ma5:
        reason: "日线完成向上触发，允许执行买点"
        weight: 1.0
        confidence: 0.7
    signal: BUY
    confidence: 0.85
    weight: 1.5

  # 规则2：月线上、周线下，典型打架，只能等
  - condition:
      monthly_trend_bullish:
        reason: "月线仍向上，大方向没有坏"
        weight: 1.0
        confidence: 0.8
      weekly_trend_bearish:
        reason: "周线正在回落，月周打架，先等位置重新站稳"
        weight: 1.0
        confidence: 0.6
    signal: WATCH
    confidence: 0.5
    weight: 1.2

  # 规则3：月线向上、周线守住中枢，日线回踩，只当回调观察
  - condition:
      monthly_trend_bullish:
        reason: "月线方向仍向上"
        weight: 1.0
        confidence: 0.8
      weekly_price_above_ma20:
        reason: "周线仍在中期均线之上，位置没有走坏"
        weight: 1.0
        confidence: 0.7
      price_below_ma5:
        reason: "日线短期回踩，等待新的触发"
        weight: 1.0
        confidence: 0.7
    signal: WATCH
    confidence: 0.6
    weight: 1.0

  # 规则4：月线和周线同时转弱，日线再给弱触发，才是SELL
  - condition:
      monthly_trend_bearish:
        reason: "月线方向向下，大级别进入防守"
        weight: 1.0
        confidence: 0.9
      weekly_trend_bearish:
        reason: "周线位置同步转弱，反弹更像卖点"
        weight: 1.0
        confidence: 0.8
      price_below_ma5:
        reason: "日线向下触发，允许执行卖点"
        weight: 1.0
        confidence: 0.7
    signal: SELL
    confidence: 0.85
    weight: 1.5
