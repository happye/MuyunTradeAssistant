# RSI动量技能
# 来源：通用技术分析指标
# ⚠️ 注意：本技能规则来自RSI标准技术分析用法，非策略库原文直接论述。
# 策略库中第44章间接提到"RSI6超买(>70)"作为情绪亢奋特征，
# 第46章提到"RSI跌到很低的位置"作为洗盘末期信号。
# 超买70/超卖30阈值和50中线为行业标准用法。

name: rsi_momentum
alias: RSI动量
description: 基于RSI相对强弱指标的买卖信号判断（通用技术指标，第44/46章间接依据）

rules:
  # RSI超买信号（短期）
  - signal: SELL
    confidence: 0.70
    weight: 0.9
    condition:
      rsi_6_above_70:
        reason: RSI-6进入超买区(>70)
      rsi_12_above_70:
        reason: RSI-12进入超买区(>70)

  # RSI超卖信号（短期）
  - signal: BUY
    confidence: 0.70
    weight: 0.9
    condition:
      rsi_6_below_30:
        reason: RSI-6进入超卖区(<30)
      rsi_12_below_30:
        reason: RSI-12进入超卖区(<30)

  # RSI多头排列（强势）
  - signal: BUY
    confidence: 0.75
    weight: 1.0
    condition:
      rsi_6_above_50:
        reason: RSI-6位于50上方
      rsi_12_above_50:
        reason: RSI-12位于50上方
      rsi_24_above_50:
        reason: RSI-24位于50上方

  # RSI空头排列（弱势）
  - signal: SELL
    confidence: 0.75
    weight: 1.0
    condition:
      rsi_6_below_50:
        reason: RSI-6位于50下方
      rsi_12_below_50:
        reason: RSI-12位于50下方
      rsi_24_below_50:
        reason: RSI-24位于50下方

  # RSI底部金叉（反弹信号）
  - signal: BUY
    confidence: 0.68
    weight: 1.1
    condition:
      rsi_6_below_30:
        reason: RSI-6超卖
      rsi_12_below_30:
        reason: RSI-12超卖

  # RSI顶部死叉（回调信号）
  - signal: SELL
    confidence: 0.68
    weight: 1.1
    condition:
      rsi_6_above_70:
        reason: RSI-6超买
      rsi_12_above_70:
        reason: RSI-12超买

  # RSI中性偏强
  - signal: HOLD
    confidence: 0.55
    weight: 0.6
    condition:
      rsi_6_above_50:
        reason: RSI-6偏强
      rsi_6_below_70:
        reason: 未进入超买

  # RSI中性偏弱
  - signal: HOLD
    confidence: 0.55
    weight: 0.6
    condition:
      rsi_6_below_50:
        reason: RSI-6偏弱
      rsi_6_above_30:
        reason: 未进入超卖
