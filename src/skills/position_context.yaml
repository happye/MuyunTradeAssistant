# 位置上下文技能
# 来源：系统化交易大纲 第41章
# 核心理念：位置比形态更重要，同样的形态在不同位置意义完全不同
# 牛市看图形，熊市看位置。高位形态=骗线，低位形态=机会

name: position_context
alias: 位置上下文
type: regulator
description: 判断价格在60日区间中的位置，高位形态降权，低位形态加权

rules:
  # 规则1：价格处于60日区间高位(>80%)且均线死叉 - 高位骗线风险
  - condition:
      price_position:
        above: 80
        reason: "价格处于60日区间高位(>80%)，形态可靠性降低"
        weight: 2.0
        confidence: 0.85
      ma5_below_ma20:
        reason: "高位出现均线死叉，典型骗线"
        weight: 1.5
        confidence: 0.8
    signal: SELL
    confidence: 0.85
    weight: 2.0

  # 规则2：价格处于60日区间高位但放量滞涨 - 主力出货信号
  # 精确定义：放量(量比>1.3) + 微涨或小跌(-1%~1%)
  - condition:
      price_position:
        above: 80
        reason: "价格处于高位区域"
        weight: 1.5
        confidence: 0.8
      volume_ratio:
        above: 1.3
        reason: "高位放量1.3倍以上"
        weight: 1.5
        confidence: 0.8
      change_range:
        min: -1.0
        max: 1.0
        reason: "放量但涨跌幅极小，滞涨=出货特征"
        weight: 2.0
        confidence: 0.85
    signal: SELL
    confidence: 0.8
    weight: 2.0

  # 规则3：价格处于60日区间低位(<20%)且缩量企稳 - 可能是底部
  - condition:
      price_position:
        below: 20
        reason: "价格处于60日区间低位(<20%)，形态可靠性增强"
        weight: 1.5
        confidence: 0.75
      volume_below_avg:
        reason: "低位缩量，抛压枯竭"
        weight: 1.5
        confidence: 0.7
    signal: WATCH
    confidence: 0.65
    weight: 1.0

  # 规则4：价格处于60日区间低位且均线金叉 - 低位反转信号
  - condition:
      price_position:
        below: 30
        reason: "价格处于低位区域"
        weight: 1.5
        confidence: 0.75
      ma5_above_ma20:
        reason: "低位均线金叉，反转概率大"
        weight: 2.0
        confidence: 0.8
      volume_above_avg:
        reason: "低位放量，资金进场"
        weight: 1.5
        confidence: 0.8
    signal: BUY
    confidence: 0.75
    weight: 1.5

  # 规则5：价格在中间位置(30%-70%) - 位置中性，依赖其他技能判断
  - condition:
      price_above_ma20:
        reason: "价格在MA20上方"
        weight: 0.5
        confidence: 0.5
      price_below_ma60:
        reason: "但低于MA60，位置中性"
        weight: 0.5
        confidence: 0.5
    signal: HOLD
    confidence: 0.4
    weight: 0.5
