# KDJ随机指标技能
# 来源：通用技术分析指标
# ⚠️ 注意：本技能规则来自KDJ标准技术分析用法，非策略库原文直接论述。
# 策略库中第46章间接提到"KDJ、RSI都跌到很低的位置"作为洗盘末期信号。
# 超买80/超卖20阈值为行业标准用法。
# v0.4.1调优：死叉从SELL降为WATCH（KDJ是短期指标，死叉≠趋势反转）

name: kdj_momentum
alias: KDJ随机指标
description: 基于KDJ随机指标的超买超卖判断（通用技术指标，第46章间接依据）
# v0.4.1 调优（ISS-011）：
# - KDJ死叉：从SELL降为WATCH（KDJ是短期指标，死叉只说明短期可能回调，不应直接卖出）
# - KDJ高位死叉：从SELL降为WATCH，confidence从0.75降到0.65（高位回调不等于趋势反转）
# - KDJ低位金叉和超卖区金叉保持BUY不变（底部反转信号仍有价值）

rules:
  # KDJ金叉（买入信号）
  - signal: BUY
    confidence: 0.70
    weight: 1.0
    condition:
      kdj_k_above_d:
        reason: KDJ金叉（K上穿D）
      kdj_k_below_80:
        reason: K值未进入超买区

  # KDJ低位金叉（强烈买入）
  - signal: BUY
    confidence: 0.80
    weight: 1.2
    condition:
      kdj_k_above_d:
        reason: KDJ金叉
      kdj_k_below_20:
        reason: K值处于低位

  # KDJ死叉（短期回调警示）
  # 调优：从SELL降为WATCH，KDJ死叉只是短期信号，不构成卖出理由
  - signal: WATCH
    confidence: 0.55
    weight: 0.8
    condition:
      kdj_k_below_d:
        reason: KDJ死叉（K下穿D），短期可能回调
      kdj_k_above_20:
        reason: K值未进入超卖区

  # KDJ高位死叉（短期回调警示，较强烈）
  # 调优：从SELL降为WATCH，高位死叉≠趋势反转，需要其他信号确认
  - signal: WATCH
    confidence: 0.65
    weight: 1.0
    condition:
      kdj_k_below_d:
        reason: KDJ高位死叉
      kdj_k_above_80:
        reason: K值处于高位，短期超买回调

  # KDJ超卖区金叉（反弹信号）
  - signal: BUY
    confidence: 0.75
    weight: 1.1
    condition:
      kdj_k_below_20:
        reason: KDJ进入超卖区
      kdj_k_above_d:
        reason: KDJ低位金叉

  # KDJ超买区死叉（回调警示）
  # 调优：从SELL降为WATCH
  - signal: WATCH
    confidence: 0.60
    weight: 0.9
    condition:
      kdj_k_above_80:
        reason: KDJ进入超买区
      kdj_k_below_d:
        reason: KDJ高位死叉

  # KDJ处于多头区域
  - signal: HOLD
    confidence: 0.60
    weight: 0.7
    condition:
      kdj_k_above_d:
        reason: KDJ维持多头排列
      kdj_k_above_50:
        reason: K值在50上方
