[pytest]
# M1 测试离线化（plan/TECHNICAL_HANDOFF.md §3）：
#   裸 `pytest -q` = 离线全量 —— 不碰真实 ~/.muyun、不花 AI 费用、不打真实外源。
# - test_all_api.py 在 tests/conftest.py 收集期排除（import 期有清代理/写证书副作用，
#   -m 事后过滤挡不住 import 副作用）；真实外源显式启用方式见 tests/README.md。
# - 统计口径沿用 L05：每次全量的 passed/skipped 数字写进 commit message，历史对比以此为准。
testpaths = tests
addopts = -m "not external"
markers =
    external: 打真实外部数据源/网络（默认 -m "not external" 排除，显式启用见 tests/README.md）
    ai: 调用真实 AI 接口（花钱；现有 MUYUN_E2E_AI 门自行 skip）
