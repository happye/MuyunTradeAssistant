  黄金:
    aliases: [黄金, 金价, 贵金属, 央行购金]
    description: 实际利率+央行购金+避险三驱动；商品价格数据可跟踪
    commodity:
      name: 黄金
      daily_symbol: AU0
      spot_vars: [AU]
      inventory_symbol: null   # 上期所黄金仓单意义有限，不绑定
    demand_data: []
    supply_note: 央行购金/ETF持仓无免费接口（缺口），用新闻代理
    sections:
      上游:
        - 环节: 黄金开采
          特点: 产量弹性小，金价上行期利润弹性大；矿产金成本相对固定
          代表公司: ["601899 紫金矿业(金+铜)", "600547 山东黄金", "600489 中金黄金", "600988 赤峰黄金", "002155 湖南黄金"]
      下游:
        - 环节: 珠宝消费
          特点: 金价高企压制消费需求，与矿企逻辑相反
          代表公司: ["600612 老凤祥", "002867 周大生", "605599 菜百股份"]
    cycle_anchors:
      - 金价趋势与波动率
      - 实际利率方向（美联储政策，新闻跟踪）
      - 央行购金动向（新闻）
    analysis_notes:
      - 黄金股与金价的相关性在急涨期会脱钩（股价领先/透支）
      - 珠宝股与矿企股对金价敏感方向相反，链条内对冲关系

  煤炭:
    aliases: [煤炭, 动力煤, 焦煤, 煤价, 火电]
    description: 动力煤看电力需求+长协政策；焦煤看钢铁链；高股息属性
    commodity:
      name: 动力煤
      daily_symbol: ZC0
      spot_vars: []
      inventory_symbol: null
    demand_data: [electricity]   # 全社会用电量实测可用
    supply_note: 坑口价/港口库存细分数据无免费接口，用期货价格+用电量代理
    sections:
      上游:
        - 环节: 动力煤开采
          特点: 长协价稳定盈利，高股息；用电量是需求锚
          代表公司: ["601088 中国神华", "601225 陕西煤业", "600188 兖矿能源", "601898 中煤能源"]
        - 环节: 焦煤开采
          特点: 价格弹性大于动力煤，跟钢铁链景气
          代表公司: ["000983 山西焦煤", "601699 潞安环能", "601666 平煤股份", "600985 淮北矿业"]
      下游:
        - 环节: 火电
          特点: 煤价下行受益方，与煤企利润跷跷板
          代表公司: ["600023 浙能电力", "600886 国投电力(水火并)", "600011 华能国际"]
    cycle_anchors:
      - 动力煤期货价格趋势
      - 全社会用电量增速
      - 迎峰度夏/度冬季节性
    analysis_notes:
      - 煤炭股"高股息+周期"双重属性，利率环境影响估值底
