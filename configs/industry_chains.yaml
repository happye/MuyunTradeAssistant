# 产业链知识图谱 (v1, ISS-061)
# 结构：环节-代表公司-关键变量 的静态映射，供 chat analyze_industry 工具组装行业数据包。
# 数据绑定分级：commodity/demand 字段只绑定 2026-08-15 live-probe 实测通过的接口；
# 未绑定的链（半导体/AI算力等无商品期货的行业）自动降级为"仅图谱+新闻"模式并在输出中标注。
# 代表公司格式："代码 名称(环节属性)"；6位代码开头用于与用户持仓交叉定位。

chains:
  锂电:
    aliases: [锂, 锂矿, 碳酸锂, 锂盐, 锂电池, 锂电, 动力电池, 新能源车, 电动车, 氢氧化锂]
    description: 碳酸锂价格中枢决定全链条利润分配；价格上行期资源端吃利润，下行期电池/整车端受益
    commodity:
      name: 碳酸锂
      daily_symbol: LC0          # futures_zh_daily_sina
      spot_vars: [LC]            # futures_spot_price
      inventory_symbol: 碳酸锂   # futures_inventory_em（仓单=库存代理）
    demand_data: [nev_penetration, car_sales, electricity]
    supply_note: SMM周度产量/库存为付费数据，用期货仓单作库存代理；产能扩张线索可用get_news查公告
    sections:
      上游:
        - 环节: 锂矿采选-锂辉石
          特点: 品位高、成本居中；澳洲Fitzroy/Greenbushes、川西甲基卡、非洲津巴布韦
          代表公司: ["002466 天齐锂业(Greenbushes参股+锂盐)", "002192 融捷股份(川西甲基卡)", "000155 川能动力(李家沟)", "002738 中矿资源(非洲Bikita)"]
        - 环节: 锂矿采选-盐湖提锂
          特点: 成本最低但受地理/镁锂比约束，扩产周期长；西藏/青海为主
          代表公司: ["000792 盐湖股份(察尔汗)", "000408 藏格矿业(察尔汗)", "000762 西藏矿业(扎布耶)"]
        - 环节: 锂矿采选-锂云母
          特点: 成本最高、品位低，价格下行期最先出清（弹性大）
          代表公司: ["002176 江特电机", "002756 永兴材料(云母+特钢)"]
      中游:
        - 环节: 锂盐加工（碳酸锂/氢氧化锂）
          特点: 加工费模式或一体化；氢氧化锂偏海外高镍客户
          代表公司: ["002460 赣锋锂业(锂盐龙头)", "002466 天齐锂业", "002738 中矿资源", "002240 盛新锂能", "300390 天华新能", "002497 雅化集团"]
        - 环节: 正极材料（磷酸铁锂/三元）
          特点: 磷酸铁锂占国内主流；加工费随碳酸锂价格波动
          代表公司: ["301358 湖南裕能(LFP龙头)", "300764 德方纳米", "688005 容百科技(三元)", "300073 当升科技"]
        - 环节: 负极/隔膜/电解液
          代表公司: ["603659 璞泰来(负极)", "600884 杉杉股份(负极)", "002812 恩捷股份(隔膜)", "300568 星源材质(隔膜)", "002709 天赐材料(电解液)", "300037 新宙邦(电解液)"]
      下游:
        - 环节: 电芯/电池
          特点: 集中度最高，议价能力强；价格下行期最受益环节
          代表公司: ["300750 宁德时代", "002594 比亚迪", "300014 亿纬锂能", "002074 国轩高科", "300207 欣旺达"]
        - 环节: 新能源整车
          特点: 终端需求源头；销量数据月度可跟踪（乘联会）
          代表公司: ["002594 比亚迪", "601633 长城汽车", "601127 赛力斯", "000625 长安汽车", "600104 上汽集团"]
        - 环节: 储能
          特点: 第二增长曲线；装机数据无免费接口（缺口）
          代表公司: ["300274 阳光电源(系统+逆变器)", "688063 派能科技(户储)", "300750 宁德时代"]
    cycle_anchors:
      - 碳酸锂价格相对上市以来/近一年区间的分位（低位=周期底部区域信号之一）
      - 供给增速 vs 需求增速差（供需平衡方向）
      - 仓单趋势（持续累库=过剩，持续去库=收紧）
      - 高成本产能（云母/回收）是否亏损减产（出清信号）
    analysis_notes:
      - 供给刚性：锂矿从勘探到投产3-5年，价格信号传导滞后，低价不会立刻减少供给
      - 需求传导滞后：终端销量->电池排产->正极->锂盐->锂矿，约2-3个季度
      - 成本曲线：盐湖<辉石<云母<回收，价格跌破某成本线则该来源供给收缩
      - 周期股估值陷阱：低PE可能出现在周期顶（盈利顶），高PE可能出现在周期底（盈利底）

  光伏:
    aliases: [光伏, 太阳能, 硅料, 多晶硅, 硅片, 组件, 电池片, 工业硅]
    description: 硅料产能过剩下全链条利润承压；技术迭代（TOPCon/BC/钙钛矿）是格局变量
    commodity:
      name: 多晶硅
      daily_symbol: PS0
      spot_vars: [PS, SI]
      inventory_symbol: 多晶硅
    demand_data: []   # 光伏装机量无免费接口（缺口），用新闻/政策代理
    supply_note: 装机数据无免费接口，需求端降级；硅料/工业硅期货价格+仓单可跟踪供给出清
    sections:
      上游:
        - 环节: 工业硅/硅料
          特点: 产能过剩重灾区；现金成本线以下的产能出清是周期底信号
          代表公司: ["600438 通威股份(硅料+电池)", "688303 大全能源(硅料)", "600089 特变电工(硅料+输变电)"]
        - 环节: 硅片
          代表公司: ["601012 隆基绿能(硅片+组件)", "002129 TCL中环", "603185 弘元绿能"]
      中游:
        - 环节: 电池片
          代表公司: ["002865 钧达股份", "600732 爱旭股份"]
        - 环节: 组件
          特点: 品牌/渠道壁垒，但同质化严重利润薄
          代表公司: ["601012 隆基绿能", "688223 晶科能源", "688599 天合光能", "002459 晶澳科技"]
      下游:
        - 环节: 逆变器/储能系统
          特点: 毛利率最高的环节之一，出海逻辑
          代表公司: ["300274 阳光电源", "300763 锦浪科技", "688390 固德威", "605117 德业股份"]
        - 环节: 辅材（玻璃/胶膜）
          代表公司: ["601865 福莱特(玻璃)", "603806 福斯特(胶膜)"]
    cycle_anchors:
      - 硅料价格相对成本线位置（跌破现金成本=出清期）
      - 仓单/库存趋势
      - 组件招标价格（新闻跟踪）
    analysis_notes:
      - 光伏是"技术迭代+产能周期"双驱动，格局比锂电更碎片化
      - 供给出清看硅料现金成本线，不是看价格绝对值

  半导体:
    aliases: [半导体, 芯片, 晶圆, 存储, 封测, 国产替代]
    description: 周期（库存）+成长（国产替代/AI）双驱动；无商品期货，数据降级为图谱+新闻
    demand_data: []   # 无免费月度数据接口（缺口）
    supply_note: 全球半导体销售额/库存周期无免费接口；用新闻+个股业绩预告代理
    sections:
      上游:
        - 环节: 设备
          代表公司: ["002371 北方华创", "688012 中微公司", "688072 拓荆科技"]
        - 环节: 材料
          代表公司: ["688126 沪硅产业(硅片)", "002409 雅克科技", "300346 南大光电"]
      中游:
        - 环节: 设计
          代表公司: ["688041 海光信息(CPU/DCU)", "688256 寒武纪(AI芯片)", "603501 韦尔股份(CIS)", "300782 卓胜微(RF)"]
        - 环节: 制造
          代表公司: ["688981 中芯国际", "688347 华虹公司"]
        - 环节: 存储
          特点: 周期性最强的环节；涨价周期弹性大
          代表公司: ["603986 兆易创新(NOR/利基DRAM)", "301308 江波龙(模组)", "688525 佰维存储(模组)"]
        - 环节: 封测
          代表公司: ["600584 长电科技", "002156 通富微电", "002185 华天科技"]
      下游:
        - 环节: 功率/模拟
          代表公司: ["600745 闻泰科技", "603290 斯达半导(IGBT)", "600460 士兰微"]
    cycle_anchors:
      - 存储价格周期（新闻跟踪涨跌价）
      - 晶圆厂稼动率/资本开支（财报+新闻）
      - 库存周转天数（财报）
    analysis_notes:
      - 半导体分析核心是"库存周期位置+国产替代进度"双框架
      - 数据缺口大（无商品价格/装机等结构化数据），结论需更多依赖个股财报与新闻

