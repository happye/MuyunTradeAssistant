# AI Investment Advisor - Global Settings
# 暮云思辨投资助手 - 全局配置

app:
  name: "暮云思辨投资助手"
  # v0.8.8.6 清理：version/mode 为死键（无代码读取，版本口径以 start.py VERSION 为准）

# 向量数据库配置（v0.8.0已废弃，v0.8.1迁移到rag配置）
# vector_store:
#   enabled: false
#   persist_dir: "./knowledge/chroma"

# RAG知识库配置（v0.8.1）
rag:
  enabled: true                               # 是否启用RAG
  knowledge_dir: "./投资策略（持续更新）"        # 策略知识目录
  index_dir: "./knowledge/index"               # 索引持久化目录
  chunk_size: 500                              # 分块大小（字）
  chunk_overlap: 50                            # 分块重叠（字）
  default_top_k: 5                             # 默认检索数量
  retrieval_method: "hybrid"                   # keyword/semantic/hybrid
  diversity_max_per_chapter: 2                 # 同一章节在top_k结果中最多占几条，防长章节（如合刊）霸榜（0=关闭）
  hybrid_weights:                              # 混合检索权重
    keyword: 0.4
    semantic: 0.6
  reranker:                                    # 二阶段重排（v0.8.9.0 P3-C，双塔粗排后交叉编码精排）
    enabled: false                              # 默认关闭（2026-09-06同体系A/B实测负收益：ON 0.433/0.232/0.286 vs OFF 0.633/0.553/0.568，产物 tests/rag_eval/eval_report*.json）；开启需空闲内存≥4GB
    model: "BAAI/bge-reranker-base"           # 交叉编码器，本地缓存缺失时会自动下载
    candidate_multiplier: 3                    # 候选池 = top_k * 该倍数，再精排截到 top_k
  embedding:                                   # 嵌入配置
    provider: "sentence"                       # sentence(默认)/tfidf(降级)
    model: "BAAI/bge-small-zh-v1.5"            # 模型名（可移植）。加载时动态解析本地HF缓存快照、命中即零联网（2026-09-06修复：不再写死本机绝对路径，换机器/迁移不断链；无缓存才走在线下载）

# 决策引擎配置
decision:
  signal_weights:
    ma_trend: 1.0
    volume_price: 1.0
    support_resistance: 1.0
    stop_loss: 1.5  # 止损权重更高
    multi_timeframe: 1.2
    # Phase 2 技术指标
    macd: 1.0
    rsi: 0.8
    boll: 0.9
    kdj: 0.8
    # Phase 3 上下文与风控
    position_context: 1.3  # 位置上下文（第41章）
    market_context: 1.5    # 大盘环境（第42章，环境决定形态有效性）
    smart_money: 1.2       # 主力行为（第46-47章）
    take_profit: 1.3       # 止盈管理（第49章）

# 技能引擎配置
skills:
  dir: "./src/skills"
  enabled:
    # Phase 1 核心技能
    - ma_trend
    - volume_price
    - support_resistance
    - stop_loss
    - multi_timeframe
    # Phase 2 技术指标
    - macd
    - rsi
    - boll
    - kdj
    # Phase 3 上下文与风控
    - position_context
    - market_context
    - smart_money
    - take_profit
    # 超跌到底确认（错杀观察，WATCH为主，6维AND）
    - oversold_confirm

  # 技能分类（ISS-001: 信号去重）
  # base: 独立信号源，产出BUY/SELL/HOLD
  # regulator: 上下文调节器，修改base信号的权重，不产出独立信号
  # action: 动作信号（止损/止盈），拥有优先级覆盖能力
  types:
    ma_trend: base
    volume_price: base
    support_resistance: base
    multi_timeframe: base
    macd: base
    rsi: base
    boll: base
    kdj: base
    position_context: regulator
    market_context: regulator
    smart_money: regulator
    stop_loss: action
    take_profit: action

# AI调节层配置（v0.8.0）
ai:
  enabled: true
  debug: false               # debug模式：打印AI交互的完整输入输出
  provider: "deepseek"       # deepseek / kimi
  direction_aware_adjustment: true  # F2（plan/fusion）：看空消息不削弱卖出强度（方向感知调节）；false=回 legacy 统一加减口径供 A/B 对照
  deepseek:
    api_key: ""                   # 留空；key 放 configs/settings.local.yaml 或环境变量 DEEPSEEK_API_KEY（ISS-042）
    base_url: "https://api.deepseek.com"
    model: "deepseek-flash"       # 官方当前名=V4.1 Flash(2026-09-10发布)；思考模式默认开启(effort=high)，非思考由 src/core/ai_model.thinking_disabled_body 统一传 thinking.type=disabled
    model_pro: "deepseek-flash"   # 深度分析也用flash非思考；v4-pro思考型更贵且偶有空content，不用
    context_window: 1000000       # 官方：CONTEXT LENGTH 1M（api-docs.deepseek.com/quick_start/pricing，2026-09-11核）；用于 chat 上下文护栏
    max_output_tokens: 384000     # 官方：MAX OUTPUT MAXIMUM 384K（同上）
  # v0.8.8.6：显式定义（benzong auto_scorer 此前静默读默认值 60s/2次，配置缺失易被误改无感知）
  request_timeout: 60
  max_retries: 2
  kimi:
    api_key: ""                   # 留空；key 放 configs/settings.local.yaml 或环境变量 KIMI_API_KEY（ISS-042）
    base_url: "https://api.moonshot.cn/v1"   # 官方文档确认（注意是.cn不是.ai）
    model: "kimi-k2.6"            # ISS-078：moonshot-v1 系列已全线下线（实测 404）；2026-09-03 探测在售: kimi-k3/kimi-k2.7-code(-highspeed)/kimi-k2.6
    model_pro: "kimi-k2.6"       # 思考型模型，content偶尔为空（reasoning_content兜底）
    context_window: 262144       # 官方：262,144 tokens（platform.moonshot.cn/docs/pricing/chat，2026-09-11核）——比 DeepSeek 小得多，是上下文护栏的实际约束方
  modifier:
    sentiment_weight: 0.3    # 情绪调节权重（buy_score *= 1 - confidence * 0.3）
    risk_position_cap: 0.7   # 高风险时仓位上限打7折
    max_news_per_stock: 10   # 每只股票最多抓取新闻条数
    cache_ttl: 3600          # 新闻缓存1小时（秒）
    tech_context_enabled: true  # v0.8.3: 是否注入技术面背景给AI

# 全市场扫描配置（v0.8.0 Phase 2）
scanner:
  rules_path: "./src/scanner/scan_rules.yaml"
  cache_ttl: 300               # 全市场行情缓存TTL(秒)，盘中5分钟
  auto_exclude_holdings: true  # 自动排除已持仓股票

# 事件驱动层配置（v0.8.0 Phase 3）
event:
  enabled: true
  rules_path: "./src/scanner/event_rules.yaml"
  auto_scan_on_analyze: true   # analyze时自动检查事件（轻量，几乎无开销）
  keyword_scan: true            # 关键词扫描（无需AI，秒级检测）
  ai_classify: true             # AI二次分类（需AI，精确判断影响等级）
  portfolio_scan: true          # events命令时扫描持仓股新闻
  max_events_display: 10        # 最大展示事件数

# 排名层配置（v0.8.0 Phase 4）
ranking:
  enabled: true                  # 是否启用排名
  weights:
    technical: 0.40              # 技术面权重
    sentiment: 0.20              # AI情绪权重（AI禁用时自动归零）
    liquidity: 0.20              # 流动性权重
    volatility: 0.20             # 波动性权重
  liquidity:
    amount_weight: 0.60          # 成交额在流动性中的权重
    turnover_weight: 0.40        # 换手率在流动性中的权重
  volatility:
    optimal_range: [2.0, 5.0]   # 最优振幅区间(%)
  display:
    top_n: 10                    # 默认展示前N名（高亮）
    show_dimensions: true        # 是否展示各维度得分明细


# 买卖点精确触发配置（v0.8.3 Phase C）
entry_exit:
  enabled: true
  atr:
    period: 14
  breakout:
    high_window: 60  # 60日突破（市场动荡，用60日避免假突破；StockData 无 high_20d，20/60 均走 high_60d）
    volume_ratio: 1.5
    atr_tolerance: 0.3
  pullback:
    ma_near_pct: 0.03
    volume_ratio_max: 0.8
    prior_gain_pct: 10
  chandelier:
    n_pilot: 3
    n_base: 2.5
    n_full: 2
    atr_period: 14
    require_ma_confirm: true
    adaptive_n: true
    adaptive_n_cap: 2.0
  trend_break:
    short_ma_fast: 5
    short_ma_slow: 20
    mid_ma_fast: 10
    mid_ma_slow: 60
    trim_ratio: 0.4
  take_profit:
    tier1_pct: 10
    tier1_trim: 0.3
    tier2_pct: 20
    tier2_trim: 0.4
    trail_pct: 0.3
  northbound:
    consecutive_days: 3
# Chat Agent配置（v0.8.0 Phase 5）
chat:
  enabled: true                    # 是否启用Chat模式
  max_history_messages: 20         # 对话历史最大消息数（控制token消耗）
  max_tool_rounds: 10              # 单次对话工具调用轮次（实际硬上限=该值×2=20轮，见 agent.hard_tool_round_limit）；ISS-061行业分析需多轮：行业+持仓+个股分析+新闻
  max_failed_rounds: 3             # 工具全部失败的连续轮次上限（失败不占轮次，AI可重试）
  persist: true                    # chat对话落盘 分析报告/chat/（每天一个文件，追加）
  stream: true                     # 回答流式输出（正文增量打印；流式失败自动回退非流式）
  max_result_length: 4000          # 工具结果最大字符数（防token爆炸）
  max_tokens: 384000               # 单次回复最大输出token；DeepSeek-V4输出上限384K（官方文档），拉满避免长回答被截断
  session_persist: true            # 会话逐消息落盘（ISS-092聊天中断恢复）：q退出/崩溃/发送失败中断后，下次启动chat可恢复继续；目录 ~/.muyun/chat_sessions/
  # 上下文护栏（2026-09-11）：工具轮次上限提到 20 轮后，单轮对话内工具结果累计量翻倍。
  # 每轮调用前估算请求 token，超窗口×budget_ratio 就折叠最早的 tool 结果；折叠后仍超则停止调工具直接作答。
  context_guard:
    enabled: true
    budget_ratio: 0.85             # 触发折叠的阈值（占 provider 上下文窗口比例，官方窗口见 ai.<provider>.context_window）
    keep_recent_tool_results: 6    # 折叠时保留最近 N 条工具结果不折叠

