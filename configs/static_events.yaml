# 预期事件日历-宏观事件表（v0.8.7 预期管理 Phase 1；v0.8.8.5 ISS-080 自动化改造）
#
# 为什么还需要本表：akshare 已有 news_economic_baidu（百度经济数据日程），
# 但实测在本环境被 "Missing BAIDUID cookies" 挡住不可用（2026-09-05 探针，
# 含 fix_curl_ssl_paths 后），后续若可接入再做（ISSUES ISS-080 待办）。
# 财报披露日历走 akshare stock_report_disclosure（动态源），不在此表。
#
# 维护规则（v0.8.8.5 起大幅简化，无需逐月/逐事件手动维护）：
# - 过期一次性事件自动归档（7 天宽限），无需手动标 landed
#   （landed=true 仍可用：主动标记"已兑现"供复盘）
# - 月度/季度周期事件用 recur 自动滚动，无需每月手动加条目
# - 唯一保留的手动事项：每年初更新当年美联储 8 次议息日期（以官网为准）
#
# recur 周期事件用法：
#   - name: "中国{m}月CPI/PPI"   # {m}=数据所属月份（公布月-1，1月回绕12月）
#     recur: monthly             # monthly=每月 day 日 / quarter=每季(1/4/7/10月) day 日
#     day: 10                    # 档期日（公布日；超出当月天数取月末兜底）
#     window_days: 2             # 公布日不固定时 ±N 天窗口
#   常用占位符：{m}=数据月（8月CPI 于 9月公布 → 显示"中国8月CPI/PPI"）
#              {q}=数据季度（10月公布的 → "中国3季度GDP"）

events:
  - name: "美联储议息-9月"
    date: "2026-09-17"
    type: policy
    impact: high
    note: "每年8次，北京时间次日凌晨公布，日期见美联储官网"
    source: static

  - name: "中国{m}月CPI/PPI"
    recur: monthly
    day: 10
    window_days: 2
    type: macro
    impact: medium
    note: "每月9-11日左右公布，国家统计局月初公告具体日期"
    source: static

  - name: "中国{q}季度GDP"
    recur: quarter
    day: 17
    window_days: 5
    type: macro
    impact: high
    note: "季末后月中旬公布，国家统计局月初公告具体日期"
    source: static

  - name: "A股三季报披露窗口"
    date: "2026-10-15"
    type: earnings
    impact: medium
    note: "10月15日-31日强制披露，具体见 akshare stock_report_disclosure"
    source: static

  - name: "A股年报披露窗口"
    date: "2027-01-15"
    type: earnings
    impact: medium
    note: "1月-4月披露，具体见 akshare stock_report_disclosure"
    source: static
