# 预期事件日历-手动维护的宏观事件表（v0.8.7 预期管理 Phase 1）
#
# akshare 无"经济事件日历"接口（含预期值/公布时间），故宏观事件用手动维护静态表。
# 财报披露日历走 akshare stock_report_disclosure（动态源），不在此表。
#
# 维护规则：
# - 每年初更新当年美联储议息日期（8次）、重要经济数据公布规律
# - 事件落地后由 calendar.py 检测过期，输出黄色提示（不自动改本文件）
# - date_window_days: 公布日不固定时±N天都算
# - landed: 事件落地后手动改 true（或由 calendar.py 提示后改）
#
# 更新日期：2026-07-25

