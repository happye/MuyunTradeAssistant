        代表公司:
        - 002475 立讯精密
        - 002241 歌尔股份
        - 300433 蓝思科技
      - 环节: AI眼镜/可穿戴
        特点: 端侧AI最具爆发力的新品类，2025-2026放量
        代表公司:
        - 002241 歌尔股份
    cycle_anchors: 端侧AI是订单/渗透率驱动，无商品价格锚；核心跟踪变量为AI手机/AI PC/AI眼镜出货量、SoC芯片新品发布节奏、终端厂商资本开支
    analysis_notes: 端侧AI与云端AI算力逻辑不同，端侧更依赖终端换机周期和AI功能渗透率；SoC芯片环节价值量最高、弹性最大；需结合新闻跟踪新品发布和出货数据
    aliases: []
    source_note: AI自举生成（基于当次板块成分股+主营构成数据），未经人工复核
