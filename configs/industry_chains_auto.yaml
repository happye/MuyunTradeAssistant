        代表公司:
        - 688608 恒玄科技(智能音频SoC)
        - 603893 瑞芯微(端侧AI SoC)
        - 688018 乐鑫科技(WiFi MCU)
        - 688766 普冉股份(存储芯片)
      - 环节: 存储芯片（端侧AI内存升级）
