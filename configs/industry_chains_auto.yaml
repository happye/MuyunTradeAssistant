chains:
  军工:
    sections:
      上游(军工电子-元器件/材料):
      - 环节: 红外热成像
        特点: 高毛利、技术壁垒高，军民两用（红外探测）
        代表公司:
        - 688002 睿创微纳(红外热成像)
        - 002414 高德红外(红外光电)
      - 环节: 连接器/互连组件
        特点: 军工电子基础元器件，受益军工信息化+民用(新能源/通信)双轮
        代表公司:
        - 002179 中航光电(电连接器)
        - 688629 华丰科技(连接器/组件)
      - 环节: 射频/T/R组件
        特点: 雷达/电子战核心，技术壁垒高
        代表公司:
        - 688375 国博电子(T/R组件/射频)
      中游(军工装备-整机/平台):
      - 环节: 航空整机
        特点: 军机平台，需求来自军机列装+换代，订单周期长
        代表公司:
        - 302132 中航成飞(航空产品)
        - 600760 中航沈飞(航空产品)
      - 环节: 航空发动机
        特点: 军机核心动力，国产替代逻辑强
        代表公司:
        - 600893 航发动力(航空发动机)
      - 环节: 船舶/海工
        特点: 军船+民船双轮，受全球造船周期影响
        代表公司:
        - 600150 中国船舶(船舶造修)
      - 环节: 卫星/通信
        特点: 卫星互联网+应急通信，军民融合
        代表公司:
        - 601698 中国卫通(卫星通信)
      下游(需求端):
      - 环节: 军队列装/国防采购
        特点: 需求来自国防预算+军品订单，政策驱动，非市场化
        代表公司: []
      - 环节: 民用延伸(商业航天/低空经济/卫星互联网)
        特点: 军民融合打开第二增长曲线
        代表公司: []
    cycle_anchors:
    - 军工无商品期货价格锚，需求端用国防预算增速/军品订单/政策催化代理
    - 周期位置判断依赖订单能见度+板块估值分位，而非商品库存
    description: 军工产业链分军工电子(上游元器件)与军工装备(中游整机)两大板块，需求端由国防采购政策驱动，非市场化供需，周期判断需用订单/政策/估值代理
    analysis_notes: 军工板块需求端无免费数据接口，需用国防预算、军品订单、政策催化等代理指标；无商品价格锚；估值用板块PE分位判断周期位置
    aliases: []
    source_note: AI自举生成（基于当次板块成分股+主营构成数据），未经人工复核
    created_at: '2026-08-17'  # v0.8.8.6 补记：军工链随 a7b214c 首次入库的日期
  端侧AI:
